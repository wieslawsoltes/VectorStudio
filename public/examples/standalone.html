<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vellum reusable components</title><link rel="icon" href="/favicon.svg"><style>*{box-sizing:border-box}body{font:14px system-ui;margin:0;color:#183d33}header{display:flex;align-items:center;gap:9px;padding:14px 20px;border-bottom:1px solid #dce5df}header strong{margin-right:20px}button{padding:8px 12px;background:white;border:1px solid #dce5df;border-radius:4px;cursor:pointer}.workspace{display:grid;grid-template-columns:220px 1fr 260px;height:calc(100vh - 70px)}vellum-canvas{height:100%;min-height:400px}aside{border-right:1px solid #dce5df}a{margin-left:auto;color:#087f68}@media(max-width:750px){.workspace{grid-template-columns:1fr 190px}.objects{display:none}header{flex-wrap:wrap}}</style></head><body><header><strong>Vellum / Component lab</strong><button data-tool="select">Select</button><button data-tool="rect">Rectangle</button><button data-tool="ellipse">Ellipse</button><button data-tool="text">Text</button><button id="undo">Undo</button><button id="export">Export SVG</button><a href="/">Open Studio →</a></header><div class="workspace"><aside class="objects"><vellum-object-tree></vellum-object-tree></aside><vellum-canvas></vellum-canvas><aside><vellum-property-grid></vellum-property-grid><vellum-color-palette></vellum-color-palette></aside></div><script type="module">
import {registerElements} from '/studio/elements/index.js';import {DocumentStore} from '/studio/core/index.js';import {sampleDocument} from '/studio/core/sample.js';import {toSVG} from '/studio/render/index.js';import {download} from '/studio/io/index.js';registerElements();const store=new DocumentStore(sampleDocument());for(const el of document.querySelectorAll('vellum-canvas,vellum-property-grid,vellum-color-palette,vellum-object-tree'))el.store=store;const canvas=document.querySelector('vellum-canvas');document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>canvas.setTool(b.dataset.tool));document.querySelector('#undo').onclick=()=>store.undo();document.querySelector('#export').onclick=()=>download(toSVG(store.doc),'artwork.svg','image/svg+xml');requestAnimationFrame(()=>canvas.fit());window.componentLab={store,canvas};
</script></body></html>
