name: Restore and qualify VectorStudio
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/recover-upload.yml]
permissions:
  contents: write
concurrency:
  group: vector-source-publication
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VELLUM_TEST_FONT: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore byte-verified source and original dependency lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test ! -f package.json
          python3 .github/scripts/restore-source.py
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/test-pages-browser.py')
          text=path.read_text()
          text=text.replace('page.locator("dialog")', 'page.locator("dialog[open]")')
          text=text.replace('page.locator("dialog button[data-action=close-dialog]")', 'page.locator("dialog[open] button[data-action=close-dialog]")')
          text=text.replace('page.locator("dialog button[data-dialog-close]")', 'page.locator("dialog[open] button[data-dialog-close]")')
          path.write_text(text)
          PY
      - name: Install locked JavaScript dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Install native validation engines
        run: |
          sudo apt-get update
          sudo apt-get install -y libcdr-dev librevenge-dev pkg-config g++ inkscape ghostscript python3-pypdf python3-venv fonts-dejavu-core
          python3 scripts/fetch-native-fixture.py
          sh native/build.sh
      - name: Bundle reusable runtime adapters
        run: node scripts/bundle-libraries.mjs
      - name: Run complete test suite and declaration checks
        shell: bash
        run: |
          mkdir -p publication-output
          set -o pipefail
          node --test tests/*.test.mjs 2>&1 | tee publication-output/tests.log
          pnpm exec tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --lib ES2022,DOM public/studio/{core,render,controls,elements,io,collab,advanced,color,typography,svg}/index.d.ts
      - name: Assemble GitHub Pages edition
        run: node scripts/build-pages.mjs
      - name: Qualify browser editing and real IndexedDB persistence
        env:
          PYTHON: .ci/browser/bin/python
        run: |
          python3 -m venv .ci/browser
          .ci/browser/bin/pip install playwright==1.55.0
          .ci/browser/bin/python -m playwright install --with-deps chromium
          node scripts/test-pages-browser.mjs
      - name: Package standalone modules
        run: |
          node scripts/package-libraries.mjs
          mkdir -p releases
          (cd packages/vector && npm pack --pack-destination ../../releases)
      - name: Commit all verified source and runnable browser bundles
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add . ':!native/vellum-cdr-pages'
          git add -f packages/vector/dist packages/vector/licenses releases/*.tgz
          python3 - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          forbidden=[p for p in paths if p.startswith(('node_modules/','data/','.env','.ci/')) or p.endswith(('.ttf','.pem','.sqlite','.db'))]
          assert not forbidden,forbidden
          print('Verified staged publication paths:',len(paths))
          PY
          git commit -m 'feat: publish Vellum Vector Studio 2.0 and browser-local Pages edition'
          git push origin HEAD:main
          python3 scripts/package-source.py publication-output/VellumVectorStudio-2.0.0-GitHub-source.zip
      - name: Preserve validation and release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vectorstudio-publication
          path: publication-output
          if-no-files-found: warn
          retention-days: 30
