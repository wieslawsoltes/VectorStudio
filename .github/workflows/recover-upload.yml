name: Recover uploaded source
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/recover-upload.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download and verify uploaded source objects
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request, hashlib, lzma
          from pathlib import Path
          shas = '''c6cce7def6861712f3a3a896c6b15cf198057451
          1ffba89f7b98cd6d0f09ebacf1cd2d95e34bae4a
          a4d49feb4b0fe210ecd0b5194a41e21b31cd47e7
          903d848cda0c3d46d5e776385a1dc64c6f6b822e
          e53ed38970036627f6f949ed72d6b14722054008
          8b0a0ba65306ec976968a53215f8806143f324c7
          5857fe8d45e54d6d4e6e64b10968c35af44bee38
          66950fed6268662fa8aa24d656e6352ff15431a8
          9bb12a0d16407dc5cbef22b5673e18b399203cd9
          4b25150bc1442bc28bf67295f043262ca76c2f85
          d718dd048c263e92aec03ce4c0d5a9b7d6c4896d
          ea9165a8e6a4734a1e14475fd0b40f23b714251a
          fcfe917f67c12873fc315ead3bfaec126bddbfae
          32a175c20e60a9130b17abf21b2665daf6558013
          6860fa70df00a0dfd1db89e896661ab8ce676d07'''.split()
          root=Path('source-recovery'); root.mkdir()
          parts=[]
          for index, sha in enumerate(shas):
            url=f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{sha}'
            req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
            with urllib.request.urlopen(req) as response: obj=json.load(response)
            data=base64.b64decode(obj['content'])
            actual=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
            assert actual==sha,(sha,actual)
            (root/f'{index:02}-{sha}.part').write_bytes(data)
            parts.append(data)
            print(index,sha,len(data))
          for name,indices in [('first12',list(range(12))),('first13',list(range(13))),('split-tail',list(range(12))+[13,14])]:
            data=b''.join(parts[i] for i in indices)
            decoder=lzma.LZMADecompressor(); output=bytearray(); error=None
            for offset in range(0,len(data),64):
              try: output.extend(decoder.decompress(data[offset:offset+64]))
              except Exception as e: error=str(e); break
            (root/(name+'.partial')).write_bytes(output)
            print(name,'decompressed',len(output),'offset',offset,'eof',decoder.eof,'error',error,'prefix',bytes(output[:120]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vector-source-recovery-objects
          path: source-recovery
          retention-days: 7
