name: Verify source recovery
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/source-recovery.yml
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check published browser module accessibility
        shell: bash
        run: |
          for path in studio/core/index.js studio/app.js; do
            echo "Checking $path"
            curl --location --silent --show-error --max-time 30 --output /tmp/source-response --write-out 'HTTP %{http_code}, type %{content_type}, bytes %{size_download}\n' "https://vellum-vector-studio.wisodev.chatgpt.site/$path" || true
            if test -f /tmp/source-response; then sha256sum /tmp/source-response; fi
          done
