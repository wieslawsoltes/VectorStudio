name: Prepare VectorStudio publication
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/prepare-publication.yml
permissions:
  contents: read
  pages: write
jobs:
  verify-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify pinned dependency availability
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const packages = {pnpm:'11.25.0',paper:'0.12.18','happy-dom':'20.14.0',harfbuzzjs:'1.6.1','lcms-wasm':'1.0.5',yjs:'13.6.32',ws:'8.21.3',jspdf:'4.2.1','svg2pdf.js':'2.8.1','opentype.js':'2.0.0','@xmldom/xmldom':'0.9.12','bidi-js':'1.1.0',linebreak:'1.1.0',wrangler:'4.92.0'};
          for (const [name, version] of Object.entries(packages)) {
            const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${version}`);
            console.log(`${name}@${version}: ${response.status}`);
            if (!response.ok) process.exitCode = 1;
          }
          JS
      - name: Verify GitHub Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{html_url,build_type,status}'
